<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Alimentos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Cadastro de Alimentos</h1>

    <form id="form-alimento">
      <div class="form-group">
        <label for="nome">Nome</label>
        <input type="text" id="nome" placeholder="Ex: Arroz" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="categoria">Categoria</label>
          <select id="categoria" required>
            <option value="">Selecione</option>
            <option value="Grão">Grão</option>
            <option value="Fruta">Fruta</option>
            <option value="Legume">Legume</option>
            <option value="Verdura">Verdura</option>
            <option value="Carne">Carne</option>
            <option value="Laticínio">Laticínio</option>
            <option value="Bebida">Bebida</option>
            <option value="Outro">Outro</option>
          </select>
        </div>

        <div class="form-group">
          <label for="calorias">Calorias (kcal)</label>
          <input type="number" id="calorias" placeholder="Ex: 130" min="0" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="proteinas">Proteínas (g)</label>
          <input type="number" id="proteinas" placeholder="Ex: 2.7" step="0.1" min="0" required>
        </div>

        <div class="form-group">
          <label for="carboidratos">Carboidratos (g)</label>
          <input type="number" id="carboidratos" placeholder="Ex: 28" step="0.1" min="0" required>
        </div>

        <div class="form-group">
          <label for="gorduras">Gorduras (g)</label>
          <input type="number" id="gorduras" placeholder="Ex: 0.3" step="0.1" min="0" required>
        </div>
      </div>

      <button type="submit">Cadastrar</button>
    </form>

    <div class="busca">
      <input type="text" id="busca" placeholder="Buscar alimento...">
    </div>

    <div id="lista-alimentos"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
