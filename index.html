<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bingo - Produtos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="container header-content">
      <h1>Bingo</h1>
      <span class="subtitle">Loja de Produtos</span>
    </div>
  </header>

  <main class="container">
    <section class="add-product">
      <h2>Adicionar Produto</h2>
      <form id="product-form">
        <div class="form-row">
          <div class="form-group">
            <label for="name">Nome *</label>
            <input type="text" id="name" placeholder="Nome do produto">
            <div class="error-msg" id="error-name"></div>
          </div>
          <div class="form-group">
            <label for="category">Categoria *</label>
            <input type="text" id="category" placeholder="Ex: Eletrônicos">
            <div class="error-msg" id="error-category"></div>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="price">Preço (R$) *</label>
            <input type="number" id="price" step="0.01" min="0" placeholder="0.00">
            <div class="error-msg" id="error-price"></div>
          </div>
          <div class="form-group">
            <label for="stock">Estoque *</label>
            <input type="number" id="stock" min="0" placeholder="0">
            <div class="error-msg" id="error-stock"></div>
          </div>
        </div>
        <div class="form-group">
          <label for="description">Descrição</label>
          <textarea id="description" rows="3" placeholder="Descrição do produto..."></textarea>
        </div>
        <button type="submit" class="btn-primary" id="btn-submit">Adicionar Produto</button>
      </form>
    </section>

    <section class="products-section">
      <div class="products-header">
        <h2>Produtos</h2>
        <div class="filters">
          <input type="text" id="search" placeholder="Buscar produto...">
          <select id="filter-category">
            <option value="">Todas categorias</option>
          </select>
          <select id="sort">
            <option value="name">Ordenar por nome</option>
            <option value="price-asc">Preço: menor → maior</option>
            <option value="price-desc">Preço: maior → menor</option>
            <option value="stock">Estoque</option>
          </select>
        </div>
      </div>
      <div id="product-count"></div>
      <div id="product-list"></div>
    </section>
  </main>

  <div id="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
