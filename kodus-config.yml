version: '1.2'
automatedReviewActive: true
kodusConfigFileOverridesWebPreferences: true
pullRequestApprovalActive: true
isRequestChangesActive: false
reviewOptions:
  security: true
  code_style: true
  kody_rules: true
  refactoring: true
  error_handling: true
  maintainability: true
  potential_issues: true
  documentation_and_comments: true
  performance_and_optimization: true
  business_logic: true
summary:
  generatePRSummary: true
  customInstructions: ''
  behaviourForExistingDescription: concatenate
suggestionControl:
  groupingMode: full
  limitationType: pr
  maxSuggestions: 9
  severityLevelFilter: medium
ignoredTitleKeywords: []
baseBranches: []
ignorePaths:
  - yarn.lock
  - package-lock.json
  - package.json
  - .env
  - '**/*.json'
llmGeneratedMemoriesRequireApproval: false
linkedRepositories:
  - repository: 'Nalu-devs/Pokedex'
    instructions: >-
      O jogo Pokedex deste repo consome a mesma PokeAPI e shape de dados que o
      repo Nalu-devs/Pokedex (arquivo javascrip.js): endpoint
      https://pokeapi.co/api/v2/pokemon/ e campos dados.types[].type.name,
      dados.sprites.front_default, dados.sprites.other.dream_world.front_default,
      dados.height, dados.weight. Valide que mudancas aqui nao divergem do
      contrato usado la.
    ref: main
